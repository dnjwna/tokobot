services:
  tokobot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: tokobot
    env_file: ../.env
    restart: unless-stopped
    stop_grace_period: 30s          # beri waktu simpan state + notifikasi shutdown
    volumes:
      - ../state:/app/state
      - ../logs:/app/logs
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    mem_limit: 512m
